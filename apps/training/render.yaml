# KORINTEK TRAINING — Configuration de déploiement Render.com
# À utiliser comme Blueprint Path lors de la création : apps/training/render.yaml

services:
  - type: web
    name: korintek-training-api
    runtime: node
    plan: free
    rootDir: apps/training/backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
        # ↑ Colle ici la MÊME connection string Neon que korintek-queue-api (réutilisation
        # de la base existante — ce module ne stocke jamais de fichier, empreinte minime).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AZURE_CLIENT_ID
        value: dca354c3-b920-41af-aa90-abf4a31969d4
      - key: AZURE_TENANT_ID
        value: 9cdff590-bed7-4a7a-a6c4-6aadd7edf896
      - key: AZURE_CLIENT_SECRET
        sync: false
        # ↑ Même Client Secret que le Queue Manager (même app registration Azure)
      - key: AZURE_REDIRECT_URI
        value: https://korintek-training-api.onrender.com/api/v1/auth/microsoft/callback
      - key: FRONTEND_URL
        value: https://korintek-training-frontend.onrender.com
        # ↑ URL par défaut Render, gratuite et illimitée — pas de domaine personnalisé
        # nécessaire ici (tes 2 domaines gratuits sont déjà utilisés par facturation
        # et queue-manager). À remplacer plus tard si un 3e domaine devient possible.
      - key: NODE_ENV
        value: production

  - type: web
    name: korintek-training-frontend
    runtime: static
    rootDir: apps/training/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://korintek-training-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
