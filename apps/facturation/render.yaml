services:
  - type: web
    name: korintek-facturation-v2
    runtime: python
    plan: free
    rootDir: apps/facturation
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        sync: false
