# KORINTEK QUEUE MANAGER — Configuration de déploiement Render.com
# Documentation : https://render.com/docs/blueprint-spec
#
# CHOIX BASE DE DONNÉES : Neon.tech (et non Render Postgres)
# Render Postgres gratuit expire 30 jours après création (suppression définitive des
# données après 14 jours de grâce). Neon.tech offre un tier gratuit permanent, sans
# date d'expiration et sans carte bancaire — c'est déjà la solution utilisée pour
# facturation.korintek.com. On la réutilise ici pour éviter toute perte de données.
#
# Étape manuelle avant le premier déploiement :
# 1. Créer un projet sur https://neon.tech (gratuit)
# 2. Créer une base nommée par ex. "korintek_queue"
# 3. Copier la connection string fournie par Neon (commence par postgresql://...)
# 4. La coller dans la variable DATABASE_URL du service korintek-queue-api ci-dessous,
#    directement dans le Dashboard Render (elle est marquée sync: false pour ne pas
#    figurer en clair dans le repo Git).

services:
  # --- Backend API ---
  - type: web
    name: korintek-queue-api
    runtime: node
    plan: free
    rootDir: apps/queue-manager/backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
        # ↑ Renseigner manuellement dans le Dashboard Render avec la connection
        # string Neon.tech (voir instructions ci-dessus). Ne jamais commit cette
        # valeur dans Git.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://queue.korintek.com
      - key: SEED_ADMIN_EMAIL
        value: admin@korintek.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
    # NOTE — mise en veille du plan gratuit :
    # Ce service se met en veille après 15 min sans requête (limite du plan free).
    # Pour éviter le délai de réveil (30-60s) au premier candidat de la matinée,
    # configurer un ping gratuit externe (ex: https://cron-job.org, gratuit, sans
    # carte bancaire) qui appelle GET https://<url-du-service>/health toutes les
    # 10 minutes pendant les heures d'ouverture du centre d'examen. Voir README
    # section 6bis pour la marche à suivre pas à pas.

  # --- Frontend ---
  - type: web
    name: korintek-queue-frontend
    runtime: static
    rootDir: apps/queue-manager/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://korintek-queue-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
